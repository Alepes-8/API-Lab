services:
  mongo:
    image: mongo:5.0
    container_name: mongo_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db

  drink_api:
    container_name: drink_api_dev
    build:
      context: .
      dockerfile: ./src/Dockerfile
      args:
        APP_VERSION: dev
        BUILD_SHA: local
    user: root          # dev only — needed for nodemon hot reload with volume mount
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      PORT: ${PORT:-5001}
      MONGO_URI: ${MONGO_URI}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nodemon src/app.js
    env_file:
      - ./.env.dev

volumes:
  mongo-dev-data: