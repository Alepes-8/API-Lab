name: CD Docker Build and Push

on:
  workflow_call:
    secrets:
      GHCR_PAT:
        required: true
      MONGO_URI:
        required: true
      JWT_SECRET:
        required: true
      APP_ADMIN_USERNAME:
        required: true
      APP_ADMIN_PASSWORD:
        required: true

jobs:
  cd-build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/alepes-8/api_lab
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build all services
        run: docker compose -f docker-compose.yml build

      - name: Start dependent services
        run: docker compose -f docker-compose.yml up -d mongo

      - name: Create .env file
        run: |
          echo "PORT=5001" >> .env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "APP_ADMIN_USERNAME=${{ secrets.APP_ADMIN_USERNAME }}" >> .env
          echo "APP_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }}" >> .env

      - name: Run tests
        run: docker compose run --rm -e NODE_ENV=test api_lab npm test

      - name: Stop services
        run: docker compose -f docker-compose.yml down

      - name: Push images to GHCR
        run: docker compose -f docker-compose.yml push

      - name: Tag and push dev
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:dev
          docker push $IMAGE_NAME:dev